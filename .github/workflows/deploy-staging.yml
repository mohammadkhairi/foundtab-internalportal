name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy'
        required: false
        default: 'main'

concurrency:
  group: portal-staging-deploy
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Build · Deploy API (staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/api

      - name: Build
        run: npm run build
        working-directory: apps/api

      - name: Deploy to Railway (staging)
        run: |
          npm install -g @railway/cli
          railway up --service foundtab-portal-api --environment staging
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  deploy-web:
    name: Deploy Web (staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Authenticate Vercel CLI
        run: |
          mkdir -p /tmp/vercel-config
          echo '${{ secrets.VERCEL_AUTH_JSON }}' > /tmp/vercel-config/auth.json

      - name: Pull Vercel project settings (preview)
        run: vercel -Q /tmp/vercel-config pull --yes --environment=preview --cwd apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (staging preview)
        id: deploy
        run: |
          url=$(vercel -Q /tmp/vercel-config deploy --cwd apps/web)
          echo "url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Alias to staging-portal.foundtab.com
        run: vercel -Q /tmp/vercel-config alias set ${{ steps.deploy.outputs.url }} staging-portal.foundtab.com --scope foundtab
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
