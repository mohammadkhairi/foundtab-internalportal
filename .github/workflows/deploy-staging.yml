name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy'
        required: false
        default: 'main'

concurrency:
  group: portal-staging-deploy
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Build · Deploy API (staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/api

      - name: Build
        run: npm run build
        working-directory: apps/api

      - name: Deploy to Railway (staging)
        run: |
          npm install -g @railway/cli
          railway up --service foundtab-portal-api --environment staging
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

  deploy-web:
    name: Deploy Web (staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Trigger Vercel deploy
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}"
